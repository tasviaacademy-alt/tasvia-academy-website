name: Fix homepage internal links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix tuition and Abacus links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s
          s = s.replace('href="#tuition">Learn More <span>→</span></a></div></article><article class="program"><img alt="Student learning at TASVIA"', 'href="/tuition-classes-nizamabad">Learn More <span>→</span></a></div></article><article class="program"><img alt="Student learning at TASVIA"', 1)
          s = s.replace('href="#why">Learn More <span>→</span></a></div></article></div></div></section>', 'href="/abacus-classes-nizamabad">Learn More <span>→</span></a></div></article></div></div></section>', 1)
          if s == original:
              print("No homepage link changes needed.")
          else:
              p.write_text(s, encoding="utf-8")
              print("Updated homepage internal links.")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage internal SEO links"
          git push
