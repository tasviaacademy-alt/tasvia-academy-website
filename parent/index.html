<html lang="en">

<meta charset="utf-8">

<title>TASVIA Parents Portal</title>
<style>body{margin:0;background:#0B2455;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}main{padding:24px}a{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:999px;background:#F2AC10;color:#171205;text-decoration:none;font-weight:700}</style>
</head>
<body>
<main><div>Opening TASVIA Parents Portal…</div><a id="go" href="https://apk.tasviaacademy.com/parent/index.html">Continue</a></main>
<script>
(function(){
  var q=window.location.search||"",h=window.location.hash||"",code=new URLSearchParams(q).get("code");
  if(!code&&h)code=h.replace(/^#/,"");
  var u="https://apk.tasviaacademy.com/parent/index.html";
  if(code)u+="?code="+encodeURIComponent(code);
  document.getElementById("go").href=u;
  setTimeout(function(){location.replace(u)},150);
})();
</script>
</body>
</html>
